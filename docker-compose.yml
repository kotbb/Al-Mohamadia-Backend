services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"

  web:
    build:
      context: ../Al-Mohamadia-Frontend
    ports:
      - "3001:3000"
    depends_on:
      - api
